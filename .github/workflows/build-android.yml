name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install npm dependencies
        run: npm ci

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # assembleDebug NÃO empacota o JS no APK (espera um Metro ao vivo);
      # só assembleRelease roda a task que gera e embute o bundle JS, por
      # isso é essa a variante certa para um APK instalável standalone.
      # O build type "release" deste projeto já usa a mesma debug.keystore
      # (ver android/app/build.gradle) e minify está desligado em
      # android/gradle.properties, então sai instalável sem passos extras.
      - name: Build release APK (standalone, com bundle JS embutido)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dexbinder-poc-scanner-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
