name: Build Android Dev Client APK

# Build de DESENVOLVIMENTO (expo-dev-client): NÃO embute o bundle JS — o
# app se conecta ao Metro rodando no computador (mesma rede Wi-Fi) e recebe
# as atualizações de JS instantaneamente (Fast Refresh) a cada arquivo
# salvo, sem precisar gerar um APK novo. Diferente do workflow principal
# (build-android.yml), que gera um APK standalone para testar longe de casa.
# Só roda manualmente (não a cada push), porque raramente precisa ser
# refeito — só quando uma dependência NATIVA nova é adicionada.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install npm dependencies
        run: npm ci

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug (dev client) APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dexbinder-poc-scanner-dev-client
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
